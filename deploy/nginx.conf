# Axonys — configuration Nginx du conteneur (Traefik gère HTTPS et les certificats en amont)
# Emplacement sur le serveur : /docker/axonys-site/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # www.coachaxonys.fr -> coachaxonys.fr
    if ($host = www.coachaxonys.fr) {
        return 301 https://coachaxonys.fr$request_uri;
    }

    # Ne jamais servir les fichiers internes du dépôt
    location ~ /\.            { return 404; }
    location ^~ /deploy/      { return 404; }
    location = /README.md     { return 404; }

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cache navigateur des fichiers statiques
    location ~* \.(css|jpg|jpeg|png|svg|woff2)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
